// The original dev.emi artifact redirects through an unreliable legacy host.
// Modrinth publishes the byte-identical NeoForge JAR; verify that identity
// before compiling so the mirror substitution cannot silently drift.
def recoveredEmiArtifact = configurations.detachedConfiguration(
        dependencies.create('maven.modrinth:emi:1.1.24+1.21.1+neoforge'))
recoveredEmiArtifact.transitive = false
def verifyRecoveredEmiArtifact = tasks.register('verifyRecoveredEmiArtifact') {
    group = 'verification'
    description = 'Verify the pinned byte identity of the recovered EMI compile dependency.'
    doLast {
        def artifactFile = recoveredEmiOverride.isPresent() ?
                recoveredEmiOverride.get() : recoveredEmiArtifact.singleFile
        if (!artifactFile.isFile()) {
            throw new GradleException('Recovered EMI artifact is missing: ' + artifactFile)
        }
        def actualSize = artifactFile.length()
        def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(artifactFile.bytes).encodeHex().toString()
        if (actualSize != 1111538L || actualSha256 != 'b68691f94f0727fc517cac2ab55bd6658d1179cc8cc715fe610b60c37469bc4c') {
            throw new GradleException('Recovered EMI artifact mismatch: ' + artifactFile +
                    ' expected size=1111538 sha256=b68691f94f0727fc517cac2ab55bd6658d1179cc8cc715fe610b60c37469bc4c' +
                    ' actual size=' + actualSize + ' sha256=' + actualSha256)
        }
        logger.lifecycle('Recovered EMI artifact verified: size=' + actualSize +
                ' sha256=' + actualSha256)
    }
}
tasks.named('compileJava').configure { dependsOn(verifyRecoveredEmiArtifact) }

def verifyRecoveredMuiArtifacts = tasks.register('verifyRecoveredMuiArtifacts') {
    group = 'verification'
    description = 'Verify the pinned ModularUI binary and corresponding-source artifacts.'
    doLast {
        def binary = recoveredMuiArtifact.singleFile
        def sources = recoveredMuiSourcesArtifact.singleFile
        def sha256 = { artifactFile ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifactFile.bytes).encodeHex().toString()
        }
        def binarySha256 = sha256(binary)
        def sourcesSha256 = sha256(sources)
        if (binary.length() != 1761336L ||
                binarySha256 != '0de8ae778722065f006028396e7a29eab19218c774774c7df51c6143bbb58eb1') {
            throw new GradleException('ModularUI binary mismatch: ' + binary +
                    ' expected size=1761336 sha256=0de8ae778722065f006028396e7a29eab19218c774774c7df51c6143bbb58eb1' +
                    ' actual size=' + binary.length() + ' sha256=' + binarySha256)
        }
        if (sources.length() != 806832L ||
                sourcesSha256 != '6bad38c38437d20a43051e81747bf477b8faec1299b8388fdd68821896fd97fa') {
            throw new GradleException('ModularUI sources mismatch: ' + sources +
                    ' expected size=806832 sha256=6bad38c38437d20a43051e81747bf477b8faec1299b8388fdd68821896fd97fa' +
                    ' actual size=' + sources.length() + ' sha256=' + sourcesSha256)
        }
        logger.lifecycle('ModularUI artifacts verified: binary size=' + binary.length() +
                ' sha256=' + binarySha256 + ', sources size=' + sources.length() +
                ' sha256=' + sourcesSha256)
    }
}
tasks.named('compileJava').configure { dependsOn(verifyRecoveredMuiArtifacts) }
