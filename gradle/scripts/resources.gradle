// java.util.Properties, and therefore Gradle's own gradle.properties parsing, decodes ISO-8859-1.
// Non-ASCII values such as the Chinese mod name arrive mojibake'd and used to be written into
// neoforge.mods.toml as UTF-8 of the wrong characters ("æ ¼é·..."). Re-read the file as UTF-8 and
// prefer those values; everything stays readable in gradle.properties.
def utf8Config = new Properties()
rootProject.file('gradle.properties').withInputStream { stream ->
    utf8Config.load(new InputStreamReader(stream, java.nio.charset.StandardCharsets.UTF_8))
}
// Script-level method bodies cannot see local variables, so resolve through a closure instead.
def configValue = { String key -> utf8Config.getProperty(key) ?: project.properties.get(key) }

def mod_id = configValue("mod_id")
def version = configValue("version")
def mod_license = configValue("mod_license")
def mod_name = configValue("mod_name")
def mod_description = configValue("mod_description")
def mod_url = configValue("mod_url")
def mod_issue_tracker = configValue("mod_issue_tracker")

String suffix = System.getenv("VERSION_SUFFIX")
String version_toml = "$version" + (suffix ? "+$suffix" : "")

tasks.register('printVersion') {
    doLast {
        println mod_version
    }
}

// Create run-folders for non-client configs to avoid pollution of dev envs
tasks.matching { it.name.startsWith('prepare') }.configureEach {
    doFirst {
        mkdir('run')
        mkdir('run/server')
        mkdir('run/gametest')
        mkdir('run/data')
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var neoVersion = libs.versions.neoForge.get()
    neoVersion = neoVersion.substring(0, neoVersion.lastIndexOf('.'))
    var configurationVersion = forge.versions.configuration.get()
    configurationVersion = configurationVersion.substring(0, configurationVersion.lastIndexOf('-'))
    var replaceProperties = [
            version             : version_toml,
            mod_id              : mod_id,
            minecraft_version   : "[1.21, 1.21.1]",
            loader_version      : libs.versions.loader.get(),
            neo_version         : neoVersion,
            configuration_version : configurationVersion,
            kjs_version         : forge.versions.kubejs.get().split("\\.")[0], // only specify major version of kjs
            jei_version         : forge.versions.jei.get(),
            emi_version         : forge.versions.emi.get(),
            jade_version        : forge.versions.jade.get(),
            modernfix_version   : forge.versions.modernfix.get(),
            sable_version       : forge.versions.sable.get(),
            mod_license         : mod_license,
            mod_name            : mod_name,
            mod_description     : mod_description,
            mod_url             : mod_url,
            mod_issue_tracker   : mod_issue_tracker
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata
